name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            automake build-essential ccache patchelf

      - name: Install Buildozer
        run: pip install --upgrade pip buildozer cython==0.29.36 virtualenv

      - name: Locate buildozer.spec
        id: locate
        run: |
          SPEC_PATH=$(find . -maxdepth 4 -name "buildozer.spec" | head -n 1)
          if [ -z "$SPEC_PATH" ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi
          echo "spec_dir=$(dirname "$SPEC_PATH")" >> "$GITHUB_OUTPUT"

      - name: Build APK (verbose)
        working-directory: ${{ steps.locate.outputs.spec_dir }}
        run: buildozer -v android debug 2>&1 | tee /home/runner/build_full.log
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Show last 200 lines of build log on failure
        if: failure()
        run: tail -n 200 /home/runner/build_full.log

      - uses: actions/upload-artifact@v4
        with:
          name: pradakshina-tracker-apk
          path: "**/bin/*.apk"
          if-no-files-found: error

      - name: Upload full build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: /home/runner/build_full.log
          if-no-files-found: ignore
