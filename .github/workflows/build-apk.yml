name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake build-essential ccache

      - name: Install Buildozer
        run: pip install --upgrade pip buildozer cython==0.29.36 virtualenv

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Locate buildozer.spec
        id: locate
        run: |
          SPEC_PATH=$(find . -maxdepth 4 -name "buildozer.spec" | head -n 1)
          if [ -z "$SPEC_PATH" ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi
          echo "spec_dir=$(dirname "$SPEC_PATH")" >> "$GITHUB_OUTPUT"

      - name: Build APK (verbose)
        working-directory: ${{ steps.locate.outputs.spec_dir }}
        run: buildozer -v android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: pradakshina-tracker-apk
          path: "**/bin/*.apk"
          if-no-files-found: error

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: "**/.buildozer/**/logs/*.txt"
          if-no-files-found: ignore
