name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libtinfo-dev cmake libffi-dev libssl-dev build-essential \
            ccache automake libltdl-dev

      - name: Install pinned build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.36
          pip install buildozer==1.5.0
          pip install python-for-android==2024.1.21

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV

      # Cache keys bumped again (-v3-) to discard any previously cached
      # master checkout of python-for-android from earlier failed runs.
      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v3-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer local directory (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-v3-${{ hashFiles('buildozer.spec') }}

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Patch buildozer.spec (fix Python version + NDK API)
        run: |
          if grep -q "^requirements" buildozer.spec; then
            sed -i -E 's/^requirements[[:space:]]*=.*/requirements = python3==3.11.9,kivy,plyer,requests/' buildozer.spec
          else
            echo "requirements = python3==3.11.9,kivy,plyer,requests" >> buildozer.spec
          fi

          if grep -q "^android.ndk_api" buildozer.spec; then
            sed -i -E 's/^android.ndk_api[[:space:]]*=.*/android.ndk_api = 24/' buildozer.spec
          else
            echo "android.ndk_api = 24" >> buildozer.spec
          fi
          if grep -q "^android.minapi" buildozer.spec; then
            sed -i -E 's/^android.minapi[[:space:]]*=.*/android.minapi = 24/' buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi

          # Remove any p4a.branch/source_dir lines — we now pin the p4a
          # checkout ourselves in the next step instead of relying on
          # buildozer.spec, since that key was not being honored.
          sed -i -E '/^p4a\.branch[[:space:]]*=/d' buildozer.spec
          sed -i -E '/^p4a\.source_dir[[:space:]]*=/d' buildozer.spec

          echo "----- Patched buildozer.spec -----"
          cat buildozer.spec

      - name: Pre-clone python-for-android at a known-good version
        run: |
          # Buildozer only clones p4a into this path if it doesn't already
          # exist. By placing a pinned, stable release here ourselves first,
          # we guarantee buildozer uses it instead of "master" (whose
          # hostpython3 recipe currently targets a broken CPython 3.14.2).
          set -e
          P4A_DIR=".buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          rm -rf "$P4A_DIR"

          # Try the exact pip-pinned release tag first; fall back to a
          # known-stable tag if the naming differs on the p4a repo.
          if git clone --branch 2024.1.21 --single-branch --depth 1 \
              https://github.com/kivy/python-for-android.git "$P4A_DIR" 2>/tmp/clone_err.log; then
            echo "Cloned p4a tag 2024.1.21 successfully."
          else
            echo "Tag 2024.1.21 not found, falling back to v2024.01.21..."
            cat /tmp/clone_err.log
            rm -rf "$P4A_DIR"
            git clone --branch v2024.01.21 --single-branch --depth 1 \
              https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi

          echo "----- p4a checked-out branch/tag -----"
          git -C "$P4A_DIR" branch -vv || true
          git -C "$P4A_DIR" describe --tags || true

      - name: Show buildozer.spec (sanity check)
        run: cat buildozer.spec

      - name: Build and auto-diagnose
        run: python build_and_diagnose.py

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build_output.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pradakshina-tracker-apk
          path: bin/*.apk
