name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libtinfo-dev cmake libffi-dev libssl-dev build-essential \
            ccache automake libltdl-dev

      - name: Install pinned build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.36
          pip install buildozer==1.5.0
          pip install python-for-android==2024.1.21

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV

      # NOTE: cache key now includes a version suffix so any previously-cached
      # master checkout of python-for-android is discarded and rebuilt clean.
      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer local directory (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-v2-${{ hashFiles('buildozer.spec') }}

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Patch buildozer.spec (fix Python/NDK version mismatch)
        run: |
          # Pin a stable python3 requirement compatible with p4a 2024.1.21
          if grep -q "^requirements" buildozer.spec; then
            sed -i -E 's/^requirements[[:space:]]*=.*/requirements = python3==3.11.9,kivy,plyer,requests/' buildozer.spec
          else
            echo "requirements = python3==3.11.9,kivy,plyer,requests" >> buildozer.spec
          fi

          # Set ndk_api/minapi to 24 (preadv/pwritev need API 24+)
          if grep -q "^android.ndk_api" buildozer.spec; then
            sed -i -E 's/^android.ndk_api[[:space:]]*=.*/android.ndk_api = 24/' buildozer.spec
          else
            echo "android.ndk_api = 24" >> buildozer.spec
          fi
          if grep -q "^android.minapi" buildozer.spec; then
            sed -i -E 's/^android.minapi[[:space:]]*=.*/android.minapi = 24/' buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi

          # CRITICAL FIX: pin p4a to a stable tagged release instead of
          # letting buildozer git-clone the "master" branch, which has a
          # hostpython3 recipe hardcoded to CPython 3.14.2 (mismatched
          # with our pinned python3==3.11.9, and broken on this NDK).
          sed -i -E '/^p4a\.branch[[:space:]]*=/d' buildozer.spec
          sed -i -E '/^p4a\.source_dir[[:space:]]*=/d' buildozer.spec
          echo "p4a.branch = 2024.1.21" >> buildozer.spec

          echo "----- Patched buildozer.spec -----"
          cat buildozer.spec

      - name: Remove any stale p4a checkout (forces re-clone of pinned branch)
        run: |
          # If a previous run (or cache) already cloned p4a's master branch,
          # buildozer will keep reusing it and ignore the p4a.branch pin above.
          # Delete it so buildozer clones the correct tagged release fresh.
          rm -rf .buildozer/android/platform/python-for-android

      - name: Build and auto-diagnose
        run: python build_and_diagnose.py

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build_output.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pradakshina-tracker-apk
          path: bin/*.apk
